version: '3.8'

services:
  pairdrop:
    image: lscr.io/linuxserver/pairdrop
    container_name: pairdrop
    environment:
      - PUID=1000
      - PGID=1000
    restart: unless-stopped
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.pairdrop.rule=Host(`pairdrop.hlspace.org`)'

      - "traefik.http.routers.pairdrop.entrypoints=websecure"
      - "traefik.http.routers.pairdrop.tls=true"
      - "traefik.http.routers.pairdrop.tls.certresolver=letsencrypt"
    networks:
      - proxy

networks:
  proxy:
    external: true
